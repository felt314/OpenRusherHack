plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	mavenCentral()
}

sourceSets {
	main {
		java {
			exclude 'org/rusherhack/mixin/mixins/common/compatibility/sodium/**'
			exclude 'org/rusherhack/mixin/mixins/common/compatibility/indium/**'
			exclude 'com/kohlschutter/**'
			exclude 'org/eclipse/**'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

loom {
	// The mod ships its access widener in intermediary; Loom needs the named namespace for
	// compilation. rusherhack.named.accesswidener is that same file converted with the
	// project's Yarn mappings (yarn 1.21+build.9).
	accessWidenerPath = file("rusherhack.named.accesswidener")
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.register('printCompileClasspath') {
	doLast { println configurations.compileClasspath.asPath }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.compilerArgs += ['-Xmaxerrs', '20000']
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
